name: release

# Push a tag that matches VERSION (v1.0.0 for 1.0.0) to build every package and
# publish them as a GitHub release, with the matching sections of the three
# CHANGELOG files as the release notes. Run it by hand to get the packages as
# workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Runs first so a wrong tag or a missing changelog entry fails before the long builds.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi
          python3 packaging/release_notes.py release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  windows:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            experimental: false
          # Windows on ARM; kept out of the way until its wheels are proven.
          - runner: windows-11-arm
            experimental: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python packaging/build.py
      # archive: false uploads the .exe itself, so the run page offers it unzipped.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.exe
          archive: false

  deb:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Built on Debian 12 so the package runs on any glibc from 2.36 up.
    container: debian:12
    env:
      DEB_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv python3-dev binutils ca-certificates
      - uses: actions/checkout@v7
      - run: python3 packaging/build.py
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.deb
          archive: false

  esp32:
    needs: notes
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.3
    env:
      # The flash package ships this esptool.exe; keep it on the version ESP-IDF bundles.
      ESPTOOL: "5.6.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: |
          . "$IDF_PATH/export.sh"
          idf.py -C esp32/node set-target esp32c3
          idf.py -C esp32/node build
          curl -fsSL -o esptool.zip "https://github.com/espressif/esptool/releases/download/v$ESPTOOL/esptool-v$ESPTOOL-windows-amd64.zip"
          python -m zipfile -e esptool.zip esptool
          python esp32/package.py --esptool esptool/esptool-windows-amd64 --merge-tool "python -m esptool"
      - uses: actions/upload-artifact@v7
        with:
          name: esp32
          path: |
            dist/*.zip
            dist/*.bin

  release:
    needs: [notes, windows, deb, esp32]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: download
          merge-multiple: true
      # Gather the packages wherever the download put them.
      - run: |
          mkdir dist
          find download -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.zip' -o -name '*.bin' \) -exec mv -t dist {} +
          ls -l dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file download/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LYWSD02 Clock Sync</title>
<link rel="icon" type="image/png" href="/static/icon.png">
<style>
  /* color-scheme makes the native widgets - select popups, number spinners and
     any scrollbar we do not style ourselves - follow the theme too. */
  :root, html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1419;
    --panel: #171d24;
    --head: #141a21;
    --hover: #1b222a;
    --line: #262e38;
    --hair: #1f262f;
    --field: #0d1218;
    --btn: #222b35;
    --btn-hover: #2c3744;
    --btn-line: #3a4654;
    --text: #dfe6ee;
    --dim: #7c8a99;
    --faint: #5c6b7a;
    --accent: #4da3ff;
    --accent-hover: #67b2ff;
    --on-accent: #07121d;
    --ok: #3fbf7f;
    --warn: #e8b23a;
    --bad: #e8604c;
    --ok-bg: rgba(63,191,127,.15);
    --warn-bg: rgba(232,178,58,.15);
    --bad-bg: rgba(232,96,76,.15);
    --tint: rgba(255,255,255,.05);
    --knob: #cfd8e2;
    --knob-shadow: 0 1px 2px rgba(0,0,0,.35);
    --scroll: #3d4753;
    --scroll-hover: #4e5a69;
    --card-shadow: 0 1px 2px rgba(0,0,0,.25);
    --sheet-shadow: 0 18px 50px rgba(0,0,0,.5);
    --veil: rgba(5,8,11,.62);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f3f5f8;
    --panel: #ffffff;
    --head: #f7f9fb;
    --hover: #f2f6fa;
    --line: #e1e7ee;
    --hair: #eef2f6;
    --field: #ffffff;
    --btn: #ffffff;
    --btn-hover: #f2f6fa;
    --btn-line: #cbd5e1;
    --text: #1d2733;
    --dim: #64748b;
    --faint: #94a3b8;
    --accent: #1a73e8;
    --accent-hover: #1765cc;
    --on-accent: #ffffff;
    --ok: #157f3c;
    --warn: #a2620a;
    --bad: #c23a20;
    --ok-bg: rgba(21,127,60,.10);
    --warn-bg: rgba(162,98,10,.12);
    --bad-bg: rgba(194,58,32,.10);
    --tint: rgba(29,39,51,.05);
    --knob: #ffffff;
    --knob-shadow: 0 1px 3px rgba(16,24,40,.28);
    --scroll: #c6cfda;
    --scroll-hover: #a9b5c3;
    --card-shadow: 0 1px 2px rgba(16,24,40,.06);
    --sheet-shadow: 0 18px 50px rgba(16,24,40,.18);
    --veil: rgba(29,39,51,.35);
  }

  /* One scrollbar look everywhere. The pseudo-elements give full control, but a
     browser ignores them as soon as scrollbar-color is set - so the standard
     properties are reserved for engines without the pseudo-elements (Firefox). */
  *::-webkit-scrollbar { width: 11px; height: 11px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: var(--scroll); border: 3px solid transparent;
    background-clip: content-box; border-radius: 11px;
  }
  *::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); background-clip: content-box; }
  *::-webkit-scrollbar-corner { background: transparent; }
  @supports not selector(::-webkit-scrollbar) {
    * { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 26px 24px 32px;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei", "PingFang TC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .2s, color .2s;
  }
  /* Fluid on purpose: the window decides how wide the table may get. */
  .wrap { width: 100%; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: .2px; }
  .meta { color: var(--dim); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  button {
    font: inherit; color: var(--text); cursor: pointer;
    background: var(--btn); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 14px; transition: background-color .15s, border-color .15s, color .15s;
  }
  button:hover:not(:disabled) { background: var(--btn-hover); border-color: var(--btn-line); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.small { padding: 4px 11px; font-size: 12.5px; border-radius: 7px; }
  #settingsBtn { padding: 7px 8px; display: inline-flex; align-items: center; }
  #settingsBtn .glyph { width: 19px; height: 19px; }
  select {
    font: inherit; color: var(--text); cursor: pointer;
    background: var(--btn); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    transition: border-color .15s;
  }
  select:hover { border-color: var(--btn-line); }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    overflow-x: auto; box-shadow: var(--card-shadow);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 11px 13px; text-align: left; white-space: nowrap; }
  th {
    font-size: 12px; font-weight: 600; color: var(--dim); background: var(--head);
    border-bottom: 1px solid var(--line);
  }
  th:first-child { border-top-left-radius: 11px; }
  th:last-child { border-top-right-radius: 11px; }
  tbody tr + tr td { border-top: 1px solid var(--hair); }
  tbody tr td { transition: background-color .12s; }
  tbody tr:hover td { background: var(--hover); }
  td.num { font-variant-numeric: tabular-nums; }
  /* With the cluster switched off there is exactly one node, so the strip and the
     node column would only state the obvious. Hiding them here keeps the table
     rendering free of column arithmetic. */
  html[data-cluster="off"] .nodes,
  html[data-cluster="off"] th:nth-child(2),
  html[data-cluster="off"] td:nth-child(2) { display: none; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; color: var(--dim); }
  .sub { display: block; font-size: 11.5px; color: var(--dim); margin-top: 1px; }
  /* An error line is a whole BleakError repr: wrap it inside the column instead
     of stretching the table past the window. */
  .sub.err { white-space: normal; color: var(--bad); max-width: 560px; }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 20px;
    font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums;
  }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.none { background: var(--tint); color: var(--dim); }
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--scroll); border-radius: 22px; transition: .18s; cursor: pointer; }
  .slider::before {
    content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
    background: var(--knob); border-radius: 50%; transition: .18s;
    box-shadow: var(--knob-shadow);
  }
  .switch input:checked + .slider { background: var(--ok); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch input:disabled + .slider { opacity: .4; cursor: default; }
  .edit { display: flex; gap: 6px; align-items: center; }
  .edit input {
    font: inherit; color: var(--text); background: var(--field);
    border: 1px solid var(--accent); border-radius: 7px; padding: 4px 9px; width: 168px;
  }
  .icon {
    background: none; border: none; padding: 3px 5px; color: var(--dim);
    display: inline-flex; align-items: center; vertical-align: middle;
  }
  .icon:hover:not(:disabled) { color: var(--text); background: none; }
  /* The two drawn icons: one stroke width, one colour, inherited from the button. */
  .glyph {
    display: block; width: 17px; height: 17px;
    fill: none; stroke: currentColor; stroke-width: 1.5;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .empty { padding: 48px; text-align: center; color: var(--dim); }
  .logs { margin-top: 20px; }
  .logbar { display: flex; align-items: center; gap: 10px; margin: 0 0 9px; }
  .logs h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 0; letter-spacing: .2px; }
  .logbox {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 6px 12px 14px; max-height: 248px; overflow-y: auto;
    box-shadow: var(--card-shadow);
    font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.8; color: var(--dim);
  }
  .logbox div { white-space: pre-wrap; word-break: break-word; padding-right: 8px; }
  .logbox time { color: var(--faint); margin-right: 8px; }
  .busy { color: var(--accent); }
  .tag {
    display: inline-block; padding: 0 6px; margin-right: 8px; border-radius: 5px;
    background: var(--tint); color: var(--dim); font-size: 11px;
  }

  .nodes { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .nodecard {
    display: block; color: var(--text); text-decoration: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; min-width: 170px; min-height: 64px; box-shadow: var(--card-shadow);
    transition: background-color .15s, border-color .15s;
  }
  a.nodecard { cursor: pointer; }
  a.nodecard:hover, a.nodecard:focus-visible {
    background: var(--hover); border-color: var(--accent);
  }
  a.nodecard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* The page you are looking at is one node among equals; say which one. */
  .nodecard.own { border-color: var(--accent); }
  .nodecard.down { opacity: .55; }
  .nodecard b { font-weight: 600; }
  .nodecard .sub { white-space: normal; max-width: 260px; }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 7px; vertical-align: middle; background: var(--bad);
  }
  .dot.up { background: var(--ok); }
  .dot.working { background: var(--accent); }
  select.pin { padding: 3px 7px; font-size: 12.5px; border-radius: 7px; max-width: 210px; }
  select.pin.down { color: var(--bad); }

  .modal {
    position: fixed; inset: 0; z-index: 10; padding: 24px;
    background: var(--veil); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
  }
  .modal[hidden] { display: none; }
  .sheet {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--sheet-shadow);
    width: 470px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column;
  }
  .sheet h2 { font-size: 15px; font-weight: 650; margin: 0; }
  .sheet h3 {
    font-size: 11.5px; font-weight: 600; color: var(--dim); text-transform: uppercase;
    margin: 20px 0 10px; letter-spacing: .6px;
  }
  .sheetbody > h3:first-child { margin-top: 0; }
  .sheethead, .sheetfoot { display: flex; align-items: center; gap: 10px; padding: 14px 18px; }
  .sheethead { border-bottom: 1px solid var(--line); }
  .sheetfoot { border-top: 1px solid var(--line); }
  .sheetbody { padding: 18px; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
  .row > span:first-child { flex: 1; color: var(--dim); }
  .row input, .row select { width: 152px; }
  .row #setTimeServer { width: 270px; max-width: 65%; }
  .row input {
    font: inherit; color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px;
    transition: border-color .15s;
  }
  .row input:hover:not(:disabled) { border-color: var(--btn-line); }
  .row input:disabled, .row select:disabled { opacity: .4; cursor: default; }
  .pair { display: flex; align-items: center; gap: 6px; }
  .pair input { width: 70px; text-align: center; }
  /* The hidden checkbox of a switch must keep its own zero size, not the width
     every other field in a row gets. */
  .row .switch input { width: 0; padding: 0; border: none; }
  .row.stack { flex-direction: column; align-items: stretch; gap: 6px; }
  .row.stack > span:first-child { flex: none; }
  .row textarea {
    font: inherit; color: var(--text); background: var(--field); width: 100%;
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; resize: vertical;
    transition: border-color .15s;
  }
  .row textarea:hover { border-color: var(--btn-line); }
  .note { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 12px 0 0; }
  .note + .note { margin-top: 6px; }
  .note:empty { display: none; }
  .row a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .row a:hover { text-decoration: underline; }
  .failure { color: var(--bad); font-size: 12.5px; }
</style>
<script>
  // Settle the theme before the first paint, otherwise the page flashes.
  document.documentElement.dataset.theme = (() => {
    const choice = localStorage.getItem("theme") || "auto";
    if (choice !== "auto") return choice;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  })();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="meta">
      <span id="hostTime"></span>

    </div>
    <div class="spacer"></div>
    <button id="settingsBtn"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.98 2.51A9.7 9.7 0 0 1 14.02 2.51L14.32 4.87A7.5 7.5 0 0 1 17.02 6.43L19.21 5.51A9.7 9.7 0 0 1 21.23 9L19.34 10.44A7.5 7.5 0 0 1 19.34 13.56L21.23 15A9.7 9.7 0 0 1 19.21 18.49L17.02 17.57A7.5 7.5 0 0 1 14.32 19.13L14.02 21.49A9.7 9.7 0 0 1 9.98 21.49L9.68 19.13A7.5 7.5 0 0 1 6.98 17.57L4.79 18.49A9.7 9.7 0 0 1 2.77 15L4.66 13.56A7.5 7.5 0 0 1 4.66 10.44L2.77 9A9.7 9.7 0 0 1 4.79 5.51L6.98 6.43A7.5 7.5 0 0 1 9.68 4.87Z"/><circle cx="12" cy="12" r="3.3"/></svg></button>

<script>
const COLUMNS = ["label", "node", "address", "model", "deviceTime", "drift", "temperature",
                 "humidity", "battery", "signal", "auto", "actions"];
const SCHEDULE_MODES = ["weekly", "daily", "off"];
const WEEKDAYS = ["0", "1", "2", "3", "4", "5", "6"];
const THEMES = ["auto", "dark", "light"];
// "" is this machine's own clock.
const TIME_SERVERS = ["", "ntp.aliyun.com", "ntp.tencent.com", "ntp.ntsc.ac.cn",
  "cn.pool.ntp.org", "pool.ntp.org", "time.windows.com", "time.apple.com",
  "time.google.com", "time.cloudflare.com"];
const TIME_SERVER_OWNERS = { "ntp.aliyun.com": "aliyun", "ntp.tencent.com": "tencent",
  "ntp.ntsc.ac.cn": "ntsc" };
const FALLBACK = "zh-CN";
const PENCIL = `<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">`
  + `<path d="M4.5 19.5l.8-4 9.9-9.9a1.7 1.7 0 0 1 2.4 0l.8.8a1.7 1.7 0 0 1 0 2.4l-9.9 9.9z"/>`
  + `<path d="M13.8 6.6l3.6 3.6"/></svg>`;
const CROSS = `<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">`
  + `<path d="M7 7l10 10M17 7L7 17"/></svg>`;

let lang = null;  // resolved from config.json on the first poll
let theme = localStorage.getItem("theme") || "auto";
let editing = null;
let devices = [];
let latest = null;
const LOG_SOURCE_LIMIT = 11;
const LOG_SOURCE_LINES = 60;
const LOG_DISPLAY_LINES = 150;
const logSources = new Map();
let logsPolling = null;
let logsClearing = false;
// The ESP32 build serves this same page and says so in /api/state.
let esp = false;
let timezoneSent = false;

const systemDark = matchMedia("(prefers-color-scheme: dark)");

function applyTheme(choice) {
  document.documentElement.dataset.theme =
    choice === "auto" ? (systemDark.matches ? "dark" : "light") : choice;
}

// Follow the OS straight away when it flips and we are on "auto".
systemDark.addEventListener("change", () => {
  if (theme === "auto") applyTheme("auto");
});

const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// The page is redrawn every two seconds whether or not anything moved, and the log
// pane alone costs over twenty milliseconds of parsing, layout and paint at its
// full length. Building the string is the cheap part, so build it and throw it away
// when it is the one already on screen. Nothing reads innerHTML back, which would
// serialise the DOM to compare it. Relative times are left out of the string (see
// since()), or a fresh "5 seconds ago" would rebuild the table on every poll.
const painted = {};

function paint(id, html) {
  if (painted[id] === html) return false;
  painted[id] = html;
  $(id).innerHTML = html;
  return true;
}

function write(id, text) {
  if (painted[id] === text) return false;
  painted[id] = text;
  $(id).textContent = text;
  return true;
}

// Swapping one row at a time leaves the row under the pointer alone unless it is
// the one that changed.
function paintRows(rows) {
  const body = $("rows");
  const before = painted.rows || [];
  painted.rows = rows;
  if (rows.length !== before.length) {
    body.innerHTML = rows.join("");
    return true;
  }
  let drew = false;
  rows.forEach((row, i) => {
    if (row === before[i]) return;
    const holder = document.createElement("tbody");
    holder.innerHTML = row;
    body.rows[i].replaceWith(holder.firstElementChild);
    drew = true;
  });
  return drew;
}

function t(key, params) {
  const table = window.LOCALES[lang] || window.LOCALES[FALLBACK];
  const template = table[key] ?? window.LOCALES[FALLBACK][key] ?? key;
  return template.replace(/\{(\w+)\}/g, (_, name) => {
    const value = params && params[name];
    return value === undefined || value === null ? "?" : String(value);
  });
}

// A peer that refuses on purpose sends a message key, not a sentence.
function logParams(params) {
  const error = params && params.error;
  if (typeof error !== "string" || !(error in window.LOCALES[FALLBACK])) return params;
  return { ...params, error: t(error) };
}

function clock(unix) {
  if (!unix) return "—";
  return new Date(unix * 1000).toLocaleString(lang, { hour12: false });
}

function ago(unix) {
  if (!unix) return t("device.neverRead");
  const seconds = Math.max(0, Math.round(Date.now() / 1000 - unix));
  if (seconds < 60) return t("time.secondsAgo", { count: seconds });
  if (seconds < 3600) return t("time.minutesAgo", { count: Math.round(seconds / 60) });
  if (seconds < 86400) return t("time.hoursAgo", { count: Math.round(seconds / 3600) });
  return t("time.daysAgo", { count: Math.round(seconds / 86400) });
}

// A rebuilt row loses :hover and fades its background back in, so the row under the
// pointer flashed every poll. The text is filled in by tick() instead.
function since(unix, template) {
  return `<span data-at="${esc(unix)}"${template ? ` data-tpl="${template}"` : ""}></span>`;
}

function tick() {
  for (const node of document.querySelectorAll("[data-at]")) {
    const text = ago(Number(node.dataset.at));
    const shown = node.dataset.tpl ? t(node.dataset.tpl, { ago: text }) : text;
    if (node.textContent !== shown) node.textContent = shown;
  }
}

function labelOf(device) {
  return device.label || t("device.defaultLabel", { tail: device.key.slice(-4) });
}

function driftCell(drift) {
  if (drift === null || drift === undefined) return '<span class="pill none">—</span>';
  const size = Math.abs(drift);
  const tone = size <= 5 ? "ok" : size < 60 ? "warn" : "bad";
  const text = size < 90 ? `${drift > 0 ? "+" : ""}${drift}s`
    : `${drift > 0 ? "+" : "-"}${Math.round(size / 60)}min`;
  return `<span class="pill ${tone}">${text}</span>`;
}

function signalCell(rssi, seenAt) {
  if (rssi === null || rssi === undefined) return '<span class="mono">—</span>';
  const level = rssi >= -60 ? 4 : rssi >= -72 ? 3 : rssi >= -84 ? 2 : 1;
  const tone = level >= 3 ? "ok" : level === 2 ? "warn" : "bad";
  return `<span class="pill ${tone}">${"▌".repeat(level)}</span>`
    + `<span class="sub">${rssi} dBm · ${since(seenAt)}</span>`;
}

// Which node is nearest, and the option to overrule it. "Automatic" names the node
// the cluster picked, so the owner is readable without opening the dropdown. Only
// nodes that heard the clock on their last scan are offered; a pin that has since
// gone out of range stays listed, disabled, so it can still be moved back.
function nodeCell(device) {
  const owner = device.node || t("node.unknown");
  const pin = device.owner_pin;
  const fresh = device.sightings.filter((sighting) => sighting.fresh);
  const options = [`<option value=""${pin ? "" : " selected"}>`
    + `${esc(t("node.automatic", { node: owner }))}</option>`]
    .concat(fresh.map((sighting) =>
      `<option value="${esc(sighting.node_id)}"${sighting.node_id === pin ? " selected" : ""}>`
      + `${esc(t("node.choice", { node: sighting.node, rssi: sighting.rssi }))}</option>`));
  if (pin && !fresh.some((sighting) => sighting.node_id === pin)) {
    options.push(`<option value="${esc(pin)}" selected disabled>`
      + `${esc(t("node.notHeard", { node: device.node || pin }))}</option>`);
  }
  const heard = device.sightings.map((sighting) =>
    `${esc(sighting.node)} ${sighting.rssi}`).join(" · ");
  return `<select class="pin${device.node_online ? "" : " down"}" data-act="pin"
            data-key="${device.key}"
            title="${esc(t("node.pinHint"))}">${options.join("")}</select>`
    + `<span class="sub">${heard || "—"}`
    + `${device.node_online ? "" : " · " + esc(t("node.offline"))}</span>`;
}

function nodeHref(node) {
  try {
    const url = new URL(node.own ? location.origin : node.url);
    return url.protocol === "http:" || url.protocol === "https:" ? url.href : null;
  } catch (_) {
    return null;
  }
}

function nodeStrip(state) {
  paint("nodes", (state.nodes || []).map((node) => {
    const dot = node.busy ? "working" : node.online ? "up" : "";
    // A refusal travels as an event key plus params, a transport failure as text.
    const why = node.error && node.error.event
      ? t(node.error.event, node.error.params) : node.error || "—";
    const line = node.busy ? t(node.busy.event, node.busy.params)
      : node.online ? t("node.devices", { count: node.devices })
      : t("node.lastError", { error: why });
    const href = nodeHref(node);
    const tag = href ? "a" : "div";
    const link = href ? ` href="${esc(href)}" target="_blank" rel="noopener noreferrer"`
      + ` title="${esc(t("node.open", { node: node.name }))}"` : "";
    return `<${tag} class="nodecard${node.own ? " own" : ""}${node.online ? "" : " down"}"${link}>
      <div><span class="dot ${dot}"></span><b>${esc(node.name)}</b>
        ${node.own ? `<span class="tag">${esc(t("node.thisOne"))}</span>` : ""}</div>
      <span class="sub">${esc(line)}</span></${tag}>`;
  }).join(""));
}

function timeServerLabel(host) {
  if (!host) return t("settings.timeServer.local");
  const owner = TIME_SERVER_OWNERS[host];
  return owner ? t("settings.timeServer.named", { host, owner: t("settings.timeServer." + owner) })
               : host;
}

// A server typed into config.json by hand still shows up, as one more choice.
function fillTimeServers(chosen) {
  const values = TIME_SERVERS.includes(chosen) ? TIME_SERVERS : [...TIME_SERVERS, chosen];
  options($("setTimeServer"), values, timeServerLabel);
  $("setTimeServer").value = chosen;
}

function syncScheduleFields() {
  const mode = $("setMode").value;
  $("setWeekday").disabled = mode !== "weekly";
  $("setHour").disabled = $("setMinute").disabled = mode === "off";
}

function syncNodeFields() {
  const on = $("setCluster").checked;
  $("setDiscovery").disabled = !on;
  $("setNodeName").disabled = $("setPeers").disabled = !on;
}

function fillSettings(settings) {
  const schedule = settings.schedule || {};
  const radio = settings.bluetooth || {};
  const node = settings.node || {};
  // The theme is this browser's own choice, so it comes from localStorage.
  $("setTheme").value = theme;
  $("setCluster").checked = node.cluster !== false;
  $("setDiscovery").checked = node.discovery !== false;
  $("setNodeName").value = node.name || "";
  $("setPeers").value = (node.peers || []).join("\n");
  $("setHost").value = settings.host;
  $("setPort").value = settings.port;
  $("setMode").value = schedule.mode;
  $("setWeekday").value = String(schedule.weekday);
  $("setHour").value = schedule.hour;
  $("setMinute").value = schedule.minute;
  fillTimeServers(settings.time_server || "");
  $("setScan").value = radio.scan_timeout;
  $("setConnect").value = radio.connect_timeout;
  $("setEnv").value = radio.env_timeout;
  $("setRetries").value = radio.retries;
  $("netGroup").hidden = esp;
  $("espGroup").hidden = !esp;
  syncScheduleFields();
  syncNodeFields();
}

async function openSettings() {

    fillSettings(await api("/api/settings"));
  } catch (error) {
    alert(error.message);
    return;
  }

}

function closeSettings() {
  $("settingsModal").hidden = true;

}

async function saveSettings() {
  const payload = {
    node: {
      name: $("setNodeName").value.trim(),
      peers: $("setPeers").value.split("\n").map((line) => line.trim()).filter(Boolean),
      cluster: $("setCluster").checked,
      discovery: $("setDiscovery").checked,
    },
    host: $("setHost").value.trim(),
    port: Number($("setPort").value),
    schedule: {
      mode: $("setMode").value,
      weekday: Number($("setWeekday").value),
      hour: Number($("setHour").value),
      minute: Number($("setMinute").value),
    },
    time_server: $("setTimeServer").value,
    bluetooth: {
      scan_timeout: Number($("setScan").value),
      connect_timeout: Number($("setConnect").value),
      env_timeout: Number($("setEnv").value),
      retries: Number($("setRetries").value),
    },
  };
  $("setSave").disabled = true;
  try {
    const result = await api("/api/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    theme = $("setTheme").value;
    localStorage.setItem("theme", theme);
    closeSettings();
    if (result.restart_required) alert(t("settings.restartNeeded"));
    poll();
  } catch (error) {
    $("setError").textContent = t("settings.rejected", { detail: error.message });
  } finally {
    $("setSave").disabled = false;
  }
}

function renderRows() {
  $("empty").style.display = devices.length ? "none" : "block";
  const locked = Boolean(latest && latest.lock);
  const drew = paintRows(devices.map((device) => {
    const label = editing === device.key
      ? `<div class="edit"><input id="labelInput" value="${esc(labelOf(device))}" maxlength="40">
           <button class="small" data-act="save" data-key="${device.key}">${esc(t("device.save"))}</button>
           <button class="icon" data-act="cancel" title="${esc(t("device.cancel"))}">${CROSS}</button></div>`
      : `<strong>${esc(labelOf(device))}</strong>
         <button class="icon" data-act="edit" data-key="${device.key}"
           title="${esc(t("device.editLabel"))}">${PENCIL}</button>
         ${device.error ? `<span class="sub err">${esc(device.error)}</span>` : ""}`;
    // Only the node that can hear the device may drive it, and only one node at a time.
    const idle = !device.pending && !locked && device.node_online;

    return `<tr>
      <td>${label}</td>
      <td>${nodeCell(device)}</td>
      <td class="mono">${esc(device.address)}</td>
      <td>${esc(device.model || "—")}<span class="sub">${esc(device.firmware || "")}</span></td>
      <td class="num">${esc(clock(device.device_time))}
        <span class="sub">${device.updated_at
          ? since(device.updated_at, "device.readAt") : esc(t("device.neverRead"))}</span></td>
      <td class="num">${driftCell(device.drift)}</td>
      <td class="num">${device.temperature != null ? esc(device.temperature) + " °C" : "—"}</td>
      <td class="num">${device.humidity != null ? esc(device.humidity) + " %" : "—"}</td>
      <td class="num">${device.battery != null ? esc(device.battery) + " %" : "—"}
        <span class="sub">${device.voltage != null ? esc(device.voltage) + " V" : ""}</span></td>
      <td class="num">${signalCell(device.rssi, device.seen_at)}</td>
      <td><label class="switch"><input type="checkbox" data-act="auto" data-key="${device.key}"
        ${device.auto ? "checked" : ""}><span class="slider"></span></label></td>
      <td>
        <button class="small" data-act="refresh" data-key="${device.key}"
          ${idle ? "" : "disabled"}>${esc(t("device.read"))}</button>
        <button class="small primary" data-act="sync" data-key="${device.key}"
          ${idle ? "" : "disabled"}>${esc(t("device.sync"))}</button>
      </td>
    </tr>`;
  }));
  tick();

  // Only when the row was actually rebuilt: otherwise the caret would jump back to
  // the start of the field on every poll.
  if (editing && drew) {
    const input = $("labelInput");
    input.focus();
    input.select();
  }
}

function renderState() {
  if (!latest) return;
  const state = latest;
  write("hostTime", t("app.hostTime", { time: clock(state.host_time) }));

  const schedule = state.schedule || {};
  const cadence = schedule.mode === "weekly"
    ? t("app.everyWeekday", { weekday: t("weekday." + schedule.weekday) })
    : t("app.everyDay");
  write("schedule", schedule.mode === "off" ? t("app.scheduleOff")
    : `${t("app.nextRun", { time: clock(state.next_run) })} (${cadence})`);

  nodeStrip(state);
  document.documentElement.dataset.cluster = state.cluster === false ? "off" : "on";

  // The lock is cluster-wide, so a job on another node stops the buttons here too.
  const lock = state.lock;
  paint("status", lock
    ? `<span class="busy">⟳ ${esc(t(lock.op.event, lock.op.params))}`
      + `${lock.mine ? "" : " · " + esc(t("app.onNode", { node: lock.holder }))}`
      + `${state.queued ? " · " + esc(t("app.queued", { count: state.queued })) : ""}</span>`
    : esc(t("app.idle")));
  $("scanBtn").disabled = Boolean(lock);
  $("readBtn").disabled = Boolean(lock);
}

function logCursors() {
  return Object.fromEntries(Array.from(logSources, ([id, source]) =>
    [id, { boot: source.boot, after: source.cursor }]));
}

function updateLogSources(response) {
  if (!response || !Array.isArray(response.sources)) return false;
  const present = new Set();
  let changed = false;
  for (const source of response.sources) {
    if (present.size >= LOG_SOURCE_LIMIT) break;
    if (!source || typeof source.id !== "string" || !source.id || present.has(source.id)
        || typeof source.boot !== "string" || !/^[0-9a-f]{16}$/i.test(source.boot)
        || !Number.isSafeInteger(source.cursor) || source.cursor < 0
        || !Array.isArray(source.logs)) continue;
    present.add(source.id);
    const previous = logSources.get(source.id);
    const sameBoot = previous && previous.boot === source.boot;
    const name = String(source.name || source.id);
    const logs = sameBoot ? previous.logs.slice() : [];
    const seen = new Set(logs.map((entry) => entry.id));
    const after = sameBoot ? previous.cursor : -1;
    let added = false;
    for (const entry of source.logs.slice(0, 20)) {
      if (!entry || !Number.isSafeInteger(entry.id) || entry.id < 0
          || entry.id <= after || entry.id > source.cursor || seen.has(entry.id)
          || !Number.isFinite(entry.at) || typeof entry.event !== "string") continue;
      seen.add(entry.id);
      logs.push({ id: entry.id, at: entry.at, event: entry.event, params: entry.params });
      added = true;
    }
    if (added || (previous && previous.logs.length && (!sameBoot || previous.name !== name))) {
      changed = true;
    }
    // Keep the newest IDs even if the node's wall clock moved backwards.
    logSources.set(source.id, {
      name, boot: source.boot, cursor: source.cursor,
      logs: logs.sort((left, right) => left.id - right.id).slice(-LOG_SOURCE_LINES),
    });
  }
  for (const [id, source] of logSources) {
    if (present.has(id)) continue;
    if (source.logs.length) changed = true;
    logSources.delete(id);
  }
  return changed;
}

function renderLogs() {
  const entries = [];
  for (const [id, source] of logSources) {
    for (const entry of source.logs) entries.push({ ...entry, source: id, node: source.name });
  }
  entries.sort((left, right) => left.at - right.at
    || left.source.localeCompare(right.source) || left.id - right.id);
  const drew = paint("logs", entries.slice(-LOG_DISPLAY_LINES).map((entry) =>
    `<div><time>${esc(new Date(entry.at * 1000).toLocaleTimeString(lang, { hour12: false }))}</time>`
    + `<span class="tag">${esc(entry.node)}</span>`
    + `${esc(t("log." + entry.event, logParams(entry.params)))}</div>`).join(""));
  // Reading scrollHeight forces a layout, so only do it when the pane changed.
  if (drew) $("logs").scrollTop = $("logs").scrollHeight;
}

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    let detail = body.detail;
    // A rejected field comes back as FastAPI's validation list, so name the field.
    if (Array.isArray(detail)) {
      detail = detail.map((item) => (item.loc || []).slice(-1)[0]).join(", ");
    } else if (detail && detail.event) {
      // Our own refusals travel as a key plus params, so this page translates them.
      detail = t(detail.event, detail.params);
    }
    throw new Error(detail || response.statusText);
  }
  return response.json();
}

function refreshLogs() {
  if (document.hidden || logsClearing || logsPolling) return logsPolling || Promise.resolve();
  logsPolling = (async () => {
    try {
      const response = await api("/api/logs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(logCursors()),
        signal: AbortSignal.timeout(10000),
      });
      if (!logsClearing && updateLogSources(response)) renderLogs();
    } catch (_) {
      // Logs are optional: retain the cache and never mark a healthy node offline.
    }
  })().finally(() => { logsPolling = null; });
  return logsPolling;
}

async function clearLogs() {
  if (logsClearing) return;
  logsClearing = true;
  $("clearLogsBtn").disabled = true;
  try {
    await api("/api/logs/clear", { method: "POST" });
    logSources.clear();
    renderLogs();
    // Discard any pre-clear reply before requesting the new tail with {}.
    if (logsPolling) await logsPolling;
  } catch (error) {
    alert(error.message);
    return;
  } finally {
    logsClearing = false;
    $("clearLogsBtn").disabled = false;
  }
  refreshLogs();
}

// A slow peer can hold /api/state past the two-second tick; piling a second request
// on top would only make the node probe twice and the page draw twice. A click
// still gets a fresh answer: it queues one more round after the one in flight.
let polling = null;
let again = false;

function poll() {
  if (polling) {
    again = true;
    return;
  }
  polling = refreshState().finally(() => {
    polling = null;
    if (again) {
      again = false;
      poll();
    }
  });
}

async function refreshState() {
  try {
    const state = await api("/api/state");
    esp = state.platform === "esp32";
    if (state.language !== lang) {
      // The language lives in config.json, so any browser can be the one that changed it.
      lang = window.LOCALES[state.language] ? state.language : FALLBACK;
      renderChrome();
    }
    latest = state;
    devices = state.devices;
    renderState();
    // Redrawing the table would shut an open dropdown or discard a half-typed label.
    const busyField = document.activeElement;
    if (!editing && !(busyField && busyField.classList.contains("pin"))) renderRows();
    else tick();
    if (esp && !state.zone && !timezoneSent) {
      timezoneSent = true;
      loadZones().then(() => {
        const zone = browserZone();
        return api("/api/timezone", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ zone, timezone: window.TIMEZONES[zone] }),
        });
      }).catch(() => { timezoneSent = false; });
    }
  } catch (error) {
    paint("status",
      `<span style="color:var(--bad)">${esc(t("app.offline", { error: error.message }))}</span>`);
    return;
  }
  refreshLogs();
}

$("langPicker").onchange = async (event) => {
  lang = event.target.value;
  renderChrome();
  renderState();
  renderRows();
  await api("/api/language", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ language: lang }),
  }).catch((error) => alert(error.message));
  poll();
};

$("readBtn").onclick = () => api("/api/read", { method: "POST" })

document.addEventListener("click", async (event) => {
  const button = event.target.closest("[data-act]");
  if (!button || button.tagName === "INPUT" || button.tagName === "SELECT") return;
  const { act, key } = button.dataset;

  if (act === "closeSettings") { closeSettings(); return; }
  if (act === "edit") { editing = key; renderRows(); return; }
  if (act === "cancel") { editing = null; renderRows(); return; }
  if (act === "save") {
    const label = $("labelInput").value;
    editing = null;
    await api(`/api/devices/${key}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ label }),
    }).catch((error) => alert(error.message));
  } else if (act === "refresh" || act === "sync") {
    button.disabled = true;
    // Busy elsewhere, or the owning node is down: say so rather than fail silently.
    await api(`/api/devices/${key}/${act}`, { method: "POST" })
      .catch((error) => alert(error.message));
  }
  poll();
});

document.addEventListener("keydown", (event) => {
  if (!$("settingsModal").hidden) {
    if (event.key === "Escape") closeSettings();
    return;
  }
  if (!editing) return;
  if (event.key === "Enter") document.querySelector('[data-act="save"]').click();
  if (event.key === "Escape") { editing = null; renderRows(); }
});

document.addEventListener("change", async (event) => {
  const field = event.target;
  const { act, key } = field.dataset;
  if (act !== "auto" && act !== "pin") return;
  const patch = act === "auto" ? { auto: field.checked }
    : { owner_pin: field.value || null };
  await api(`/api/devices/${key}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(patch),
  }).catch((error) => alert(error.message));
  poll();
});

poll();
// A tab nobody is looking at keeps its own node awake and polling its peers for
// nothing, so stop until it comes back - and catch up the moment it does.
setInterval(() => { if (!document.hidden && !polling) poll(); }, 2000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
